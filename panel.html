<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <!-- El panel no debe aparecer en buscadores: es la vista interna del salón. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- MISMO bundle que index.html (misma app React, mismo router, mismos chunks). Lo único que
         cambia es el manifest: iOS decide qué app instala según el manifest que estaba presente
         cuando cargó ESTA página, así que el ícono agregado desde /panel abre la agenda del
         profesional y no la portada del cliente. -->
    <link rel="manifest" href="/panel.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mi Agenda" />
    <link rel="apple-touch-icon" href="/panel-apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Mi Agenda</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Mismo vigía de arranque que index.html (ver el comentario allá). En la app instalada es
      // todavía más importante: acá no hay barra de direcciones ni "recargar sin caché".
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          try {
            if (sessionStorage.getItem('agenda-rescate')) return;
            sessionStorage.setItem('agenda-rescate', '1');
          } catch (e) {
            return;
          }
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          }
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
